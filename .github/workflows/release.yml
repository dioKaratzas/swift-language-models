name: Release

# Releases when a pull request with a release label merges, or by hand from main with the bump to apply. A merge runs in
# the base repository's context, so a merged pull request from a fork can release too. It never checks out or runs the
# pull request's head: it runs the base branch's scripts, reads the labels and the tags, then publishes a release at the
# merge commit.
on:
  pull_request_target:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: The part of the version to raise from the latest tag
        type: choice
        options: [patch, minor, major]
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.pull_request.merged && (
      contains(github.event.pull_request.labels.*.name, 'release:patch') ||
      contains(github.event.pull_request.labels.*.name, 'release:minor') ||
      contains(github.event.pull_request.labels.*.name, 'release:major')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Both triggers check out main, never a pull request's head; only the scripts are needed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Work out the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          if [ -z "$BUMP" ]; then
            BUMP=$(jq -r '.[]' <<< "$LABELS" | bash .github/scripts/release-version.sh bump)
          fi
          gh api --paginate "repos/$GH_REPO/tags" --jq '.[].name' \
            | bash .github/scripts/release-version.sh next "$BUMP" >> "$GITHUB_OUTPUT"
      - name: First release
        if: steps.version.outputs.next == ''
        run: echo "::notice::No X.Y.Z tag yet. Tag the first release by hand; later releases run here."
      - name: Tag and publish
        if: steps.version.outputs.next != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BODY: ${{ github.event.pull_request.body }}
          LAST: ${{ steps.version.outputs.last }}
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          set -euo pipefail
          options=(--target "$SHA" --generate-notes --notes-start-tag "$LAST")
          # A catalog update's description lists the models it adds, deprecates or changes, so it leads the notes.
          if [ "$HEAD_REF" = catalog/update ]; then
            printf '%s\n' "$BODY" > "$RUNNER_TEMP/notes.md"
            options+=(--notes-file "$RUNNER_TEMP/notes.md")
          fi
          gh release create "$NEXT" "${options[@]}"
