name: Release

# Runs in the base repository's context, so a merged pull request from a fork can release too. It never checks out or
# runs the pull request's code: it reads the labels and the tags, then publishes a release at the merge commit.
on:
  pull_request_target:
    types: [closed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event.pull_request.merged && (
      contains(github.event.pull_request.labels.*.name, 'release:patch') ||
      contains(github.event.pull_request.labels.*.name, 'release:minor') ||
      contains(github.event.pull_request.labels.*.name, 'release:major'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Tag and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
          SHA: ${{ github.event.pull_request.merge_commit_sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          last=$(gh api --paginate "repos/$GH_REPO/tags" --jq '.[].name' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
          if [ -z "$last" ]; then
            echo "::notice::No X.Y.Z tag yet. Tag the first release by hand; later merges release on their own."
            exit 0
          fi

          IFS=. read -r major minor patch <<< "$last"
          case " $LABELS " in
            *" release:major "*)
              # Before 1.0 a breaking release bumps the minor version; 1.0.0 is tagged by hand.
              if [ "$major" -eq 0 ]; then minor=$((minor + 1)); else major=$((major + 1)); minor=0; fi
              patch=0 ;;
            *" release:minor "*) minor=$((minor + 1)); patch=0 ;;
            *) patch=$((patch + 1)) ;;
          esac
          tag="$major.$minor.$patch"

          # A catalog update's description lists the models it adds, deprecates or changes, so it leads the notes.
          notes=()
          if [ "$HEAD_REF" = catalog/update ]; then
            printf '%s\n' "$BODY" > "$RUNNER_TEMP/notes.md"
            notes=(--notes-file "$RUNNER_TEMP/notes.md")
          fi
          gh release create "$tag" --target "$SHA" --generate-notes --notes-start-tag "$last" "${notes[@]}"
