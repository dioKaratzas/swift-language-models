name: Model catalog

on:
  schedule:
    - cron: "30 9 * * *"
      timezone: "Europe/Athens"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: model-catalog
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
  # One rolling pull request: each run rebuilds the branch from main as one commit and updates the open pull request,
  # so a pull request waiting for review never piles up behind newer ones.
  BRANCH: catalog/update

jobs:
  update:
    name: Update the model catalog
    # The pull request targets main, so only a run on main may open it.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      # Pull requests opened with GITHUB_TOKEN start no workflows, so CI would never run and auto-merge would wait
      # forever. The app's token pushes and opens the pull request instead.
      - name: App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          client-id: ${{ vars.CATALOG_APP_CLIENT_ID }}
          private-key: ${{ secrets.CATALOG_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          token: ${{ steps.app.outputs.token }}
      - name: Build the generator
        run: swift build --product ModelCatalogGenerator -Xswiftc -warnings-as-errors
      - name: Fetch
        # Exit code 2 means a source failed or looked broken: the job fails and opens nothing.
        run: swift run --skip-build ModelCatalogGenerator fetch --package-directory . | tee "$RUNNER_TEMP/fetch.log"
      - name: Render
        run: swift run --skip-build ModelCatalogGenerator render --package-directory .
      - name: Classify the changes
        id: changes
        # Writes the changelog and the release the changes need: none, patch or major.
        run: |
          swift run --skip-build ModelCatalogGenerator diff --base HEAD --package-directory .
          echo "bump=$(jq -r .bump .build/catalog/report.json)" >> "$GITHUB_OUTPUT"
          if [ -n "$(git status --porcelain -- Catalogs Sources)" ]; then changed=true; else changed=false; fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
      - name: Build and test
        if: steps.changes.outputs.changed == 'true'
        run: |
          swift build --build-tests -Xswiftc -warnings-as-errors
          swift test --skip-build
      - name: Open or update the pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          BUMP: ${{ steps.changes.outputs.bump }}
        run: |
          bot="${APP_SLUG}[bot]"
          git config user.name "$bot"
          git config user.email "$(gh api "users/$bot" --jq .id)+$bot@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add Catalogs Sources
          git commit --quiet -m "chore: update the model catalog"

          # The body is ready before anything is pushed. Each part is cut at a line, never inside a character, so it
          # stays under GitHub's limit without a pipe that fails the step.
          cap() { LC_ALL=C awk -v max="$1" '{ n += length($0) + 1; if (n > max) { print "…"; exit } print }' "$2"; }
          {
            cap 55000 .build/catalog/CHANGELOG.md
            printf '\n<details><summary>Fetch log</summary>\n\n```\n'
            cap 5000 "$RUNNER_TEMP/fetch.log"
            printf '```\n\n</details>\n'
          } > "$RUNNER_TEMP/body.md"

          # Replaces the labels, since a later run can change the release. A change only to an API's shape releases
          # nothing, so it gets no release label.
          label() {
            jq -n --arg bump "$BUMP" '{labels: (
              (if $bump == "none" then [] else ["release:\($bump)"] end)
              + (if $bump == "major" then ["needs-review"] else [] end))}' \
              | gh api -X PUT "repos/$GITHUB_REPOSITORY/issues/$1/labels" --input - > /dev/null
          }

          title="chore: update the model catalog"
          pr=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          # An open pull request stops merging and takes its new labels before its commit is replaced, so a failure
          # later in this step never leaves it set to merge content its labels don't describe.
          if [ -n "$pr" ]; then
            gh pr merge "$pr" --disable-auto 2> /dev/null || true
            label "$pr"
          fi
          git push --force origin "$BRANCH"
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          else
            url=$(gh pr create --base main --head "$BRANCH" --title "$title" --body-file "$RUNNER_TEMP/body.md")
            pr=${url##*/}
            label "$pr"
          fi

          # A major release waits for a person; anything else merges once CI passes, and a release label releases it.
          if [ "$BUMP" != major ]; then
            gh pr merge "$pr" --auto --squash
          fi
