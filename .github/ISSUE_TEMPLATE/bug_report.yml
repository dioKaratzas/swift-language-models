name: Bug report
description: Something doesn't work the way the documentation says it should.
labels: [bug]
body:
  - type: textarea
    attributes:
      label: Description
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
      description: The smallest code that shows the problem, with the model id and the options it uses.
      render: swift
    validations:
      required: true
  - type: textarea
    attributes:
      label: Error or response
      description: The error the session throws, or the response it returns. Remove any API keys first.
      render: text
  - type: input
    attributes:
      label: Package version
      placeholder: "0.1.0, or a commit"
    validations:
      required: true
  - type: input
    attributes:
      label: Xcode and OS versions
      placeholder: "Xcode 27.2, iOS 27.2 simulator"
    validations:
      required: true
